<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP Board Bringup</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #191c24;
    --fg: #d6dbe5;
    --dim: #7c8494;
    --accent: #6fb3ff;
    --err: #ff8080;
    --ok: #7bd88f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid #262a35;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  #state { margin-left: auto; font-size: 12px; color: var(--dim); }
  #state.up { color: var(--ok); }
  #state.down { color: var(--err); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #log .err { color: var(--err); }
  #log .sent { color: var(--accent); }
  form {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border-top: 1px solid #262a35;
  }
  #cmd {
    flex: 1;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid #303643;
    border-radius: 4px;
    font: inherit;
  }
  #cmd:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 8px 16px;
    background: var(--accent);
    color: #10131a;
    border: 0;
    border-radius: 4px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
</style>
</head>
<body>
<header>
  <h1>ESP Board Bringup</h1>
  <span id="state">connecting...</span>
</header>
<div id="log"></div>
<form id="form" autocomplete="off">
  <input id="cmd" placeholder="Type a command, e.g. help" autofocus>
  <button type="submit">Send</button>
</form>
<script>
(function () {
  const log = document.getElementById('log');
  const state = document.getElementById('state');
  const form = document.getElementById('form');
  const cmd = document.getElementById('cmd');

  // Command history, same UP/DOWN behaviour as the serial console.
  const history = [];
  let historyPos = 0;
  let socket = null;

  function append(text, cls) {
    // Stick to the bottom only if the user has not scrolled up to read.
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    const node = document.createElement('span');
    if (cls) node.className = cls;
    node.textContent = text;
    log.appendChild(node);
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  function setState(text, cls) {
    state.textContent = text;
    state.className = cls || '';
  }

  function connect() {
    socket = new WebSocket('ws://' + location.host + '/ws');

    socket.onopen = () => setState('connected', 'up');
    socket.onmessage = (event) => append(event.data);
    socket.onclose = () => {
      setState('disconnected - retrying', 'down');
      // The board reboots on `system reset`; reconnect rather than stranding
      // the page.
      setTimeout(connect, 2000);
    };
    socket.onerror = () => setState('connection error', 'down');
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const line = cmd.value.trim();
    if (!line || !socket || socket.readyState !== WebSocket.OPEN) return;
    // Echoed locally: the board deliberately does not echo commands back, to
    // avoid producing output from inside the HTTP server's own task.
    append(line + '\n', 'sent');
    socket.send(line);
    history.push(line);
    historyPos = history.length;
    cmd.value = '';
  });

  cmd.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowUp' && historyPos > 0) {
      event.preventDefault();
      cmd.value = history[--historyPos];
    } else if (event.key === 'ArrowDown') {
      event.preventDefault();
      historyPos = Math.min(historyPos + 1, history.length);
      cmd.value = historyPos === history.length ? '' : history[historyPos];
    }
  });

  connect();
})();
</script>
</body>
</html>
